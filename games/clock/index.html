<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đồng hồ & Học tiếng Anh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        }

        .clock-number {
            position: absolute;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #0f172a;
            font-size: 1.125rem;
        }

        .hand {
            position: absolute;
            left: 50%;
            bottom: 50%;
            transform-origin: bottom center;
            border-radius: 9999px;
            transition: none;
        }

        .hand-min {
            width: 0.375rem;
            height: 6rem;
            background-color: #2563eb;
            z-index: 20;
        }

        .hand-hour {
            width: 0.5rem;
            height: 3.5rem;
            background-color: #0f172a;
            z-index: 10;
        }

        /* Animations */
        .spinning-min {
            transition: transform 0.7s ease-in-out;
        }

        .spinning-hour {
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .fade-in-word {
            animation: fadeInWord 0.3s ease-out forwards;
        }

        @keyframes fadeInWord {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-slate-800 p-6 rounded-3xl shadow-2xl border border-slate-700">
        <h1 class="text-xl font-bold text-center mb-6 text-blue-400 uppercase tracking-wide">
            Đồng Hồ & Học Tiếng Anh
        </h1>

        <!-- Clock Face -->
        <div class="relative w-64 h-64 mx-auto mb-8 bg-white rounded-full border-[8px] border-slate-600 shadow-inner">
            <div id="clock-marks"></div>
            <div id="clock-numbers"></div>
            
            <!-- Hands -->
            <div id="hour-hand" class="hand hand-hour" style="transform: translateX(-50%) rotate(0deg);"></div>
            <div id="min-hand" class="hand hand-min" style="transform: translateX(-50%) rotate(0deg);"></div>
            
            <!-- Center Pin -->
            <div class="absolute w-3 h-3 bg-slate-900 rounded-full left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 border-2 border-white z-30 shadow-sm"></div>
        </div>

        <!-- Manual Controls -->
        <div class="flex flex-col gap-2 mb-4">
            <!-- Row 1: Backwards -->
            <div class="grid grid-cols-3 gap-2">
                <button onclick="handleSequentialSpin(-300)" id="btn-back-5" class="control-btn flex flex-col items-center justify-center gap-1 py-2 bg-red-900/20 hover:bg-red-900/40 text-red-400 rounded-lg text-[10px] font-bold transition-all border border-red-500/20 active:scale-95">
                    <i data-lucide="history" class="w-4 h-4"></i> -5 PHÚT
                </button>
                <button onclick="handleSequentialSpin(-900)" id="btn-back-15" class="control-btn flex flex-col items-center justify-center gap-1 py-2 bg-red-900/20 hover:bg-red-900/40 text-red-400 rounded-lg text-[10px] font-bold transition-all border border-red-500/20 active:scale-95">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i> -1/4 (15P)
                </button>
                <button onclick="handleSequentialSpin(-1800)" id="btn-back-30" class="control-btn flex flex-col items-center justify-center gap-1 py-2 bg-red-900/20 hover:bg-red-900/40 text-red-400 rounded-lg text-[10px] font-bold transition-all border border-red-500/20 active:scale-95">
                    <i data-lucide="chevrons-left" class="w-4 h-4"></i> -1/2 (30P)
                </button>
            </div>

            <!-- Row 2: Forwards -->
            <div class="grid grid-cols-3 gap-2">
                <button onclick="handleSequentialSpin(300)" id="btn-fwd-5" class="control-btn flex flex-col items-center justify-center gap-1 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-[10px] font-bold transition-all border border-slate-600 active:scale-95">
                    <i data-lucide="timer" class="w-4 h-4"></i> 5 PHÚT
                </button>
                <button onclick="handleSequentialSpin(900)" id="btn-fwd-15" class="control-btn flex flex-col items-center justify-center gap-1 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-[10px] font-bold transition-all border border-slate-600 active:scale-95">
                    <i data-lucide="chevron-right" class="w-4 h-4"></i> 1/4 (15P)
                </button>
                <button onclick="handleSequentialSpin(1800)" id="btn-fwd-30" class="control-btn flex flex-col items-center justify-center gap-1 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-[10px] font-bold transition-all border border-slate-600 active:scale-95">
                    <i data-lucide="chevrons-right" class="w-4 h-4"></i> 1/2 (30P)
                </button>
            </div>

            <button onclick="handleSequentialSpin(3600)" id="btn-1h" class="w-full flex items-center justify-center gap-2 py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold shadow-lg active:scale-95 transition-all">
                <i data-lucide="rotate-cw" id="icon-spin-1h" class="w-5 h-5"></i>
                QUAY 1 VÒNG (1 GIỜ)
            </button>
        </div>

        <!-- English Section -->
        <div class="mt-4 p-4 bg-slate-900/50 rounded-2xl border border-slate-700 shadow-inner">
            <div class="flex flex-col items-center gap-4">
                <div id="word-display" class="h-12 flex flex-wrap items-center justify-center text-center text-lg font-medium text-blue-100 italic">
                    <!-- Words go here -->
                </div>

                <div class="flex gap-2 w-full">
                    <button onclick="handleNextWord()" id="btn-next-word" class="flex-1 flex items-center justify-center gap-2 py-2.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-[11px] font-bold transition-all border border-slate-600 active:bg-slate-500">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> TỪ TIẾP THEO
                    </button>
                    
                    <button onclick="handleSpeak()" id="btn-speak" class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg text-[11px] font-bold transition-all border bg-slate-700 hover:bg-blue-900/40 text-blue-400 border-blue-500/30">
                        <i data-lucide="volume2" class="w-4 h-4"></i> PHÁT ÂM
                    </button>
                </div>
            </div>
        </div>

        <!-- Bottom Bar -->
        <div class="mt-6 flex items-center justify-between pt-4 border-t border-slate-700">
            <button onclick="handleReset()" class="p-2 text-slate-500 hover:text-white transition-colors" title="Làm mới">
                <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
            </button>
            
            <div class="px-4 py-1 bg-slate-900 rounded-full border border-slate-700 shadow-inner">
                <span id="digital-time" class="font-mono text-xl text-blue-400 tracking-widest">00:00</span>
            </div>

            <button onclick="toggleAutoRun()" id="btn-toggle-run" class="p-2 rounded-full transition-all text-green-400 hover:bg-green-900/20" title="Chạy tự động">
                <i data-lucide="play" id="icon-play-pause" class="w-6 h-6"></i>
            </button>
        </div>
    </div>

    <script>
        // --- Configuration & State ---
        const apiKey = ""; 
        let minSeconds = 0;
        let hourSeconds = 0;
        let isRunning = false;
        let isMinSpinning = false;
        let isHourSpinning = false;
        let isSpeaking = false;
        let revealedWordsCount = 0;
        let lastTimestamp = 0;
        const speed = 100;

        const numberToText = [
            "twelve", "one", "two", "three", "four", "five", "six", 
            "seven", "eight", "nine", "ten", "eleven", "twelve"
        ];

        // --- Initialization ---
        function initClock() {
            const marksContainer = document.getElementById('clock-marks');
            const numbersContainer = document.getElementById('clock-numbers');

            // Marks
            for (let i = 0; i < 60; i++) {
                const mark = document.createElement('div');
                mark.className = `absolute left-1/2 top-1 w-0.5 ${i % 5 === 0 ? 'h-3 bg-slate-800' : 'h-1.5 bg-slate-400'}`;
                mark.style.transformOrigin = '50% 120px';
                mark.style.transform = `translateX(-50%) rotate(${i * 6}deg)`;
                marksContainer.appendChild(mark);
            }

            // Numbers
            for (let i = 1; i <= 12; i++) {
                const numDiv = document.createElement('div');
                numDiv.className = 'clock-number';
                numDiv.innerText = i;
                const angle = i * 30;
                numDiv.style.left = '50%';
                numDiv.style.top = '50%';
                numDiv.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translateY(-95px) rotate(-${angle}deg)`;
                numbersContainer.appendChild(numDiv);
            }

            lucide.createIcons();
            requestAnimationFrame(animate);
        }

        // --- Core Logic ---
        function getDisplayTime() {
            const totalMins = Math.floor(((minSeconds % 3600) + 3600) % 3600 / 60);
            const totalHrs = Math.floor(((hourSeconds % 43200) + 43200) % 43200 / 3600);
            return { mins: totalMins, hrs: totalHrs === 0 ? 12 : totalHrs };
        }

        function getTimePhrase() {
            const { mins, hrs } = getDisplayTime();
            const displayHrs = hrs;
            const nextHrs = (displayHrs % 12) + 1;

            if (mins === 0) return `${numberToText[displayHrs]} o'clock`;
            if (mins === 15) return `quarter past ${numberToText[displayHrs]}`;
            if (mins === 30) return `half past ${numberToText[displayHrs]}`;
            if (mins === 45) return `quarter to ${numberToText[nextHrs]}`;
            
            if (mins < 30) return `${mins} minutes past ${numberToText[displayHrs]}`;
            return `${60 - mins} minutes to ${numberToText[nextHrs]}`;
        }

        function updateClockUI() {
            const minHand = document.getElementById('min-hand');
            const hourHand = document.getElementById('hour-hand');
            const digitalDisplay = document.getElementById('digital-time');

            const minDeg = minSeconds * 0.1;
            const hourDeg = hourSeconds * (360 / 43200);

            minHand.style.transform = `translateX(-50%) rotate(${minDeg}deg)`;
            hourHand.style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;

            const { mins, hrs } = getDisplayTime();
            digitalDisplay.innerText = `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;

            updateEnglishPhrase();
        }

        function updateEnglishPhrase() {
            const container = document.getElementById('word-display');
            const phrase = getTimePhrase();
            const words = phrase.split(" ");
            
            container.innerHTML = "";
            for (let i = 0; i < Math.min(revealedWordsCount, words.length); i++) {
                const span = document.createElement('span');
                span.className = "mr-1 fade-in-word";
                span.innerText = words[i];
                container.appendChild(span);
            }
        }

        // --- Animation & Interaction ---
        function animate(timestamp) {
            if (lastTimestamp && isRunning) {
                const deltaTime = (timestamp - lastTimestamp) / 1000;
                const increment = deltaTime * speed;
                minSeconds += increment;
                hourSeconds += increment;
                updateClockUI();
            }
            lastTimestamp = timestamp;
            requestAnimationFrame(animate);
        }

        async function handleSequentialSpin(secondsToAdd) {
            if (isMinSpinning || isHourSpinning || isRunning) return;

            // Reset English reveal when time changes
            revealedWordsCount = 0;

            const minHand = document.getElementById('min-hand');
            const hourHand = document.getElementById('hour-hand');

            // Phase 1: Minute Hand
            isMinSpinning = true;
            minHand.classList.add('spinning-min');
            minSeconds += secondsToAdd;
            updateClockUI();

            const delay = Math.abs(secondsToAdd) <= 300 ? 400 : 750;
            await new Promise(r => setTimeout(r, delay));
            minHand.classList.remove('spinning-min');
            isMinSpinning = false;

            // Phase 2: Hour Hand
            isHourSpinning = true;
            hourHand.classList.add('spinning-hour');
            hourSeconds += secondsToAdd;
            updateClockUI();

            await new Promise(r => setTimeout(r, 550));
            hourHand.classList.remove('spinning-hour');
            isHourSpinning = false;
        }

        function handleNextWord() {
            const phrase = getTimePhrase();
            const words = phrase.split(" ");
            if (revealedWordsCount < words.length) {
                revealedWordsCount++;
                updateEnglishPhrase();
            }
        }

        function toggleAutoRun() {
            if (isMinSpinning || isHourSpinning) return;
            isRunning = !isRunning;
            const btn = document.getElementById('btn-toggle-run');
            const icon = document.getElementById('icon-play-pause');
            
            if (isRunning) {
                btn.classList.replace('text-green-400', 'text-red-400');
                icon.setAttribute('data-lucide', 'pause');
                revealedWordsCount = 0;
            } else {
                btn.classList.replace('text-red-400', 'text-green-400');
                icon.setAttribute('data-lucide', 'play');
            }
            lucide.createIcons();
        }

        function handleReset() {
            isRunning = false;
            minSeconds = 0;
            hourSeconds = 0;
            revealedWordsCount = 0;
            isMinSpinning = false;
            isHourSpinning = false;
            
            const icon = document.getElementById('icon-play-pause');
            icon.setAttribute('data-lucide', 'play');
            document.getElementById('btn-toggle-run').classList.replace('text-red-400', 'text-green-400');
            
            updateClockUI();
            lucide.createIcons();
        }

        // --- TTS Engine ---
        async function handleSpeak() {
            if (isSpeaking) return;
            isSpeaking = true;
            const btn = document.getElementById('btn-speak');
            const phrase = getTimePhrase();

            btn.classList.add('bg-blue-600', 'text-white', 'animate-pulse');

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Say clearly: ${phrase}` }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } }
                        }
                    })
                });
                
                const result = await response.json();
                const audioData = result.candidates[0].content.parts[0].inlineData.data;
                const mimeType = result.candidates[0].content.parts[0].inlineData.mimeType;
                const sampleRate = parseInt(mimeType.split('rate=')[1]) || 24000;
                
                const binaryString = atob(audioData);
                const pcmData = new Int16Array(binaryString.length / 2);
                for (let i = 0; i < pcmData.length; i++) {
                    pcmData[i] = (binaryString.charCodeAt(i * 2 + 1) << 8) | binaryString.charCodeAt(i * 2);
                }
                
                const wavBlob = pcmToWav(pcmData, sampleRate);
                const audio = new Audio(URL.createObjectURL(wavBlob));
                audio.onended = () => {
                    isSpeaking = false;
                    btn.classList.remove('bg-blue-600', 'text-white', 'animate-pulse');
                };
                audio.play();
            } catch (error) {
                console.error("TTS Error:", error);
                isSpeaking = false;
                btn.classList.remove('bg-blue-600', 'text-white', 'animate-pulse');
            }
        }

        function pcmToWav(pcmData, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };
            writeString(0, 'RIFF');
            view.setUint32(4, 32 + pcmData.length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, pcmData.length * 2, true);
            for (let i = 0; i < pcmData.length; i++) {
                view.setInt16(44 + i * 2, pcmData[i], true);
            }
            return new Blob([buffer], { type: 'audio/wav' });
        }

        // Start App
        window.onload = initClock;
    </script>
</body>
</html>
